<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="overBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="overGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffed4e"/>
    </linearGradient>
    <linearGradient id="overGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#55efc4"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#overBg)"/>

  <!-- Header -->
  <text x="540" y="70" font-family="Arial, sans-serif" font-size="18" fill="#ffd700" text-anchor="middle" letter-spacing="4">THE CARIBBEAN'S SERVICE MARKETPLACE</text>

  <text x="540" y="140" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">How CariCom Pros</text>
  <text x="540" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#overGold)" text-anchor="middle">Works For You</text>

  <!-- Center Hub -->
  <circle cx="540" cy="540" r="120" fill="url(#overGold)"/>
  <text x="540" y="520" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">CariCom</text>
  <text x="540" y="550" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e" text-anchor="middle">PROS</text>
  <text x="540" y="580" font-family="Arial, sans-serif" font-size="14" fill="#1a1a2e" text-anchor="middle">Platform</text>

  <!-- Connecting Lines -->
  <line x1="540" y1="420" x2="540" y2="310" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="540" y1="660" x2="540" y2="770" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="420" y1="540" x2="250" y2="540" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="660" y1="540" x2="830" y2="540" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="455" y1="455" x2="340" y2="340" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="625" y1="455" x2="740" y2="340" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="455" y1="625" x2="340" y2="740" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="625" y1="625" x2="740" y2="740" stroke="#ffd700" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Top - Post Jobs -->
  <g transform="translate(440, 250)">
    <circle cx="100" cy="0" r="55" fill="#16213e" stroke="#ffd700" stroke-width="2"/>
    <text x="100" y="10" font-size="30" text-anchor="middle">📝</text>
    <text x="100" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Post Jobs</text>
  </g>

  <!-- Bottom - Get Paid -->
  <g transform="translate(440, 770)">
    <circle cx="100" cy="0" r="55" fill="#16213e" stroke="#00b894" stroke-width="2"/>
    <text x="100" y="10" font-size="30" text-anchor="middle">💵</text>
    <text x="100" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Get Paid</text>
  </g>

  <!-- Left - Customers -->
  <g transform="translate(100, 480)">
    <circle cx="100" cy="60" r="55" fill="url(#overGold)"/>
    <text x="100" y="70" font-size="30" text-anchor="middle">👤</text>
    <text x="100" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffd700" text-anchor="middle">Customers</text>
  </g>

  <!-- Right - Professionals -->
  <g transform="translate(780, 480)">
    <circle cx="100" cy="60" r="55" fill="url(#overGreen)"/>
    <text x="100" y="70" font-size="30" text-anchor="middle">🔧</text>
    <text x="100" y="140" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00b894" text-anchor="middle">Professionals</text>
  </g>

  <!-- Top Left - Quotes -->
  <g transform="translate(240, 280)">
    <circle cx="50" cy="50" r="45" fill="#16213e" stroke="#ffd700" stroke-width="2"/>
    <text x="50" y="60" font-size="24" text-anchor="middle">💬</text>
    <text x="50" y="115" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Quotes</text>
  </g>

  <!-- Top Right - Verification -->
  <g transform="translate(740, 280)">
    <circle cx="50" cy="50" r="45" fill="#16213e" stroke="#00b894" stroke-width="2"/>
    <text x="50" y="60" font-size="24" text-anchor="middle">✓</text>
    <text x="50" y="115" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Verified</text>
  </g>

  <!-- Bottom Left - Reviews -->
  <g transform="translate(240, 690)">
    <circle cx="50" cy="50" r="45" fill="#16213e" stroke="#ffd700" stroke-width="2"/>
    <text x="50" y="60" font-size="24" text-anchor="middle">⭐</text>
    <text x="50" y="115" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Reviews</text>
  </g>

  <!-- Bottom Right - Escrow -->
  <g transform="translate(740, 690)">
    <circle cx="50" cy="50" r="45" fill="#16213e" stroke="#00b894" stroke-width="2"/>
    <text x="50" y="60" font-size="24" text-anchor="middle">🔒</text>
    <text x="50" y="115" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Escrow</text>
  </g>

  <!-- Bottom Stats Bar -->
  <g transform="translate(90, 920)">
    <rect width="900" height="80" rx="15" fill="#16213e"/>

    <g transform="translate(150, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffd700" text-anchor="middle">100%</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Secure</text>
    </g>

    <g transform="translate(350, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffd700" text-anchor="middle">Free</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">To Join</text>
    </g>

    <g transform="translate(550, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffd700" text-anchor="middle">Verified</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Professionals</text>
    </g>

    <g transform="translate(750, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffd700" text-anchor="middle">Caribbean</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle">Wide</text>
    </g>
  </g>

  <text x="540" y="1050" font-family="Arial, sans-serif" font-size="20" fill="#ffd700" text-anchor="middle">caricompros.com</text>
</svg>
