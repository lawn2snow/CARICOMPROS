<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="diasporaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1628"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="diasporaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffed4e"/>
    </linearGradient>
    <linearGradient id="oceanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#diasporaBg)"/>

  <!-- World map suggestion - dots -->
  <g opacity="0.1" fill="#ffd700">
    <circle cx="200" cy="300" r="4"/>
    <circle cx="250" cy="280" r="3"/>
    <circle cx="180" cy="350" r="3"/>
    <circle cx="300" cy="320" r="4"/>
    <circle cx="150" cy="400" r="3"/>
    <circle cx="280" cy="380" r="3"/>
    <!-- Connection lines to Caribbean -->
    <line x1="300" y1="400" x2="540" y2="540" stroke="#ffd700" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="800" y1="300" x2="540" y2="540" stroke="#ffd700" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="900" y1="500" x2="540" y2="540" stroke="#ffd700" stroke-width="1" stroke-dasharray="5,5"/>
  </g>

  <!-- Location pins -->
  <g transform="translate(150, 200)">
    <circle cx="0" cy="0" r="25" fill="#0077b6" opacity="0.3"/>
    <text x="0" y="8" font-size="24" text-anchor="middle">🇺🇸</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">USA</text>
  </g>
  <g transform="translate(880, 180)">
    <circle cx="0" cy="0" r="25" fill="#0077b6" opacity="0.3"/>
    <text x="0" y="8" font-size="24" text-anchor="middle">🇬🇧</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">UK</text>
  </g>
  <g transform="translate(250, 120)">
    <circle cx="0" cy="0" r="25" fill="#0077b6" opacity="0.3"/>
    <text x="0" y="8" font-size="24" text-anchor="middle">🇨🇦</text>
    <text x="0" y="50" font-family="Arial" font-size="12" fill="#888" text-anchor="middle">Canada</text>
  </g>

  <!-- Central Caribbean highlight -->
  <g transform="translate(540, 400)">
    <circle cx="0" cy="0" r="120" fill="url(#diasporaGold)" opacity="0.1"/>
    <circle cx="0" cy="0" r="80" fill="url(#diasporaGold)" opacity="0.15"/>
    <circle cx="0" cy="0" r="50" fill="url(#diasporaGold)"/>
    <text x="0" y="15" font-size="40" text-anchor="middle">🏝️</text>
  </g>

  <!-- Main headline -->
  <text x="540" y="580" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">Living Abroad?</text>
  <text x="540" y="650" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#diasporaGold)" text-anchor="middle">We've Got Home</text>
  <text x="540" y="720" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#diasporaGold)" text-anchor="middle">Covered.</text>

  <!-- Subheadline -->
  <text x="540" y="790" font-family="Arial, sans-serif" font-size="24" fill="#aaaaaa" text-anchor="middle">Hire trusted professionals in the Caribbean</text>
  <text x="540" y="825" font-family="Arial, sans-serif" font-size="24" fill="#aaaaaa" text-anchor="middle">from anywhere in the world</text>

  <!-- Trust points -->
  <g transform="translate(180, 880)" font-family="Arial, sans-serif">
    <g>
      <text font-size="18" fill="#ffd700">🔒</text>
      <text x="30" font-size="16" fill="#ffffff">Secure Payments</text>
    </g>
    <g transform="translate(230, 0)">
      <text font-size="18" fill="#ffd700">✓</text>
      <text x="30" font-size="16" fill="#ffffff">Verified Pros</text>
    </g>
    <g transform="translate(430, 0)">
      <text font-size="18" fill="#ffd700">📱</text>
      <text x="30" font-size="16" fill="#ffffff">Track Progress</text>
    </g>
    <g transform="translate(630, 0)">
      <text font-size="18" fill="#ffd700">💬</text>
      <text x="30" font-size="16" fill="#ffffff">Direct Chat</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(340, 950)">
    <rect width="400" height="70" rx="35" fill="url(#diasporaGold)"/>
    <text x="200" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Take Care of Home →</text>
  </g>

  <!-- Website -->
  <text x="540" y="1055" font-family="Arial, sans-serif" font-size="18" fill="#ffd700" text-anchor="middle">caricompros.com</text>
</svg>
