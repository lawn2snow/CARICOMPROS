<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="trustBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f1628"/>
    </linearGradient>
    <linearGradient id="trustGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffed4e"/>
    </linearGradient>
    <linearGradient id="trustGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#55efc4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#trustBg)"/>

  <!-- Header -->
  <text x="540" y="100" font-family="Arial, sans-serif" font-size="22" fill="#ffd700" text-anchor="middle" letter-spacing="4">WHY DIASPORA TRUST US</text>

  <!-- Shield visual -->
  <g transform="translate(390, 140)">
    <rect width="300" height="260" rx="30" fill="#16213e" stroke="url(#trustGreen)" stroke-width="4"/>
    <text x="150" y="160" font-size="120" text-anchor="middle">🛡️</text>
    <text x="150" y="230" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#00b894" text-anchor="middle">PROTECTED</text>
  </g>

  <!-- Headline -->
  <text x="540" y="465" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">Sending Money Home</text>
  <text x="540" y="525" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#trustGold)" text-anchor="middle">Shouldn't Be Scary</text>

  <!-- Trust features -->
  <g transform="translate(100, 580)" font-family="Arial, sans-serif">
    <!-- Feature 1 -->
    <g>
      <rect width="420" height="130" rx="20" fill="#16213e"/>
      <circle cx="65" cy="65" r="40" fill="url(#trustGreen)"/>
      <text x="65" y="75" font-size="32" text-anchor="middle">🔒</text>
      <text x="130" y="50" font-size="20" font-weight="bold" fill="#ffffff">Escrow Protection</text>
      <text x="130" y="80" font-size="14" fill="#888888">Your payment is held securely until</text>
      <text x="130" y="100" font-size="14" fill="#888888">you confirm the job is done right</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(460, 0)">
      <rect width="420" height="130" rx="20" fill="#16213e"/>
      <circle cx="65" cy="65" r="40" fill="url(#trustGreen)"/>
      <text x="65" y="75" font-size="32" text-anchor="middle">✓</text>
      <text x="130" y="50" font-size="20" font-weight="bold" fill="#ffffff">Verified Pros Only</text>
      <text x="130" y="80" font-size="14" fill="#888888">Background checks, ID verification,</text>
      <text x="130" y="100" font-size="14" fill="#888888">and skill assessments required</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 150)">
      <rect width="420" height="130" rx="20" fill="#16213e"/>
      <circle cx="65" cy="65" r="40" fill="url(#trustGreen)"/>
      <text x="65" y="75" font-size="32" text-anchor="middle">📸</text>
      <text x="130" y="50" font-size="20" font-weight="bold" fill="#ffffff">Photo Documentation</text>
      <text x="130" y="80" font-size="14" fill="#888888">See before, during, and after photos</text>
      <text x="130" y="100" font-size="14" fill="#888888">of every job from your phone</text>
    </g>

    <!-- Feature 4 -->
    <g transform="translate(460, 150)">
      <rect width="420" height="130" rx="20" fill="#16213e"/>
      <circle cx="65" cy="65" r="40" fill="url(#trustGreen)"/>
      <text x="65" y="75" font-size="32" text-anchor="middle">💬</text>
      <text x="130" y="50" font-size="20" font-weight="bold" fill="#ffffff">Direct Communication</text>
      <text x="130" y="80" font-size="14" fill="#888888">Chat directly with your pro</text>
      <text x="130" y="100" font-size="14" fill="#888888">No middleman, no miscommunication</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(290, 920)">
    <rect width="500" height="70" rx="35" fill="url(#trustGold)"/>
    <text x="250" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Get Protected Today</text>
  </g>

  <!-- Website -->
  <text x="540" y="1040" font-family="Arial, sans-serif" font-size="22" fill="#ffd700" text-anchor="middle">caricompros.com</text>
</svg>
