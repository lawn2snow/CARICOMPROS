<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="verifyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="verifyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#55efc4"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#verifyBg)"/>

  <!-- Header badge -->
  <g transform="translate(290, 60)">
    <rect width="500" height="50" rx="25" fill="url(#verifyGreen)"/>
    <text x="250" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">✓ TRUST &amp; SAFETY</text>
  </g>

  <text x="540" y="170" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle">How We Verify</text>
  <text x="540" y="225" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#verifyGreen)" text-anchor="middle">Every Professional</text>

  <!-- Verification steps -->
  <g transform="translate(100, 280)">
    <!-- Step 1 -->
    <g>
      <rect width="420" height="160" rx="20" fill="#16213e" stroke="#00b894" stroke-width="2"/>
      <rect width="60" height="160" rx="20" fill="url(#verifyGreen)"/>
      <text x="30" y="95" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">1</text>
      <text x="100" y="50" font-size="36">🪪</text>
      <text x="150" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">ID Verification</text>
      <text x="80" y="90" font-family="Arial, sans-serif" font-size="14" fill="#888888">Government-issued ID checked</text>
      <text x="80" y="115" font-family="Arial, sans-serif" font-size="14" fill="#888888">to confirm real identity</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(460, 0)">
      <rect width="420" height="160" rx="20" fill="#16213e" stroke="#00b894" stroke-width="2"/>
      <rect width="60" height="160" rx="20" fill="url(#verifyGreen)"/>
      <text x="30" y="95" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">2</text>
      <text x="100" y="50" font-size="36">📋</text>
      <text x="150" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Background Check</text>
      <text x="80" y="90" font-family="Arial, sans-serif" font-size="14" fill="#888888">Criminal background screening</text>
      <text x="80" y="115" font-family="Arial, sans-serif" font-size="14" fill="#888888">for your safety</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 190)">
      <rect width="420" height="160" rx="20" fill="#16213e" stroke="#00b894" stroke-width="2"/>
      <rect width="60" height="160" rx="20" fill="url(#verifyGreen)"/>
      <text x="30" y="95" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">3</text>
      <text x="100" y="50" font-size="36">📜</text>
      <text x="150" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">License Check</text>
      <text x="80" y="90" font-family="Arial, sans-serif" font-size="14" fill="#888888">Trade licenses and certifications</text>
      <text x="80" y="115" font-family="Arial, sans-serif" font-size="14" fill="#888888">verified where required</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(460, 190)">
      <rect width="420" height="160" rx="20" fill="#16213e" stroke="#00b894" stroke-width="2"/>
      <rect width="60" height="160" rx="20" fill="url(#verifyGreen)"/>
      <text x="30" y="95" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">4</text>
      <text x="100" y="50" font-size="36">💼</text>
      <text x="150" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Skill Assessment</text>
      <text x="80" y="90" font-family="Arial, sans-serif" font-size="14" fill="#888888">Experience and qualifications</text>
      <text x="80" y="115" font-family="Arial, sans-serif" font-size="14" fill="#888888">reviewed and confirmed</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(0, 380)">
      <rect width="420" height="160" rx="20" fill="#16213e" stroke="#00b894" stroke-width="2"/>
      <rect width="60" height="160" rx="20" fill="url(#verifyGreen)"/>
      <text x="30" y="95" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">5</text>
      <text x="100" y="50" font-size="36">📞</text>
      <text x="150" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Phone Verification</text>
      <text x="80" y="90" font-family="Arial, sans-serif" font-size="14" fill="#888888">Contact number confirmed</text>
      <text x="80" y="115" font-family="Arial, sans-serif" font-size="14" fill="#888888">for reliable communication</text>
    </g>

    <!-- Result -->
    <g transform="translate(460, 380)">
      <rect width="420" height="160" rx="20" fill="url(#verifyGreen)"/>
      <text x="210" y="50" font-size="50" text-anchor="middle">🏆</text>
      <text x="210" y="100" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Verified Badge</text>
      <text x="210" y="130" font-family="Arial, sans-serif" font-size="14" fill="#1a1a2e" text-anchor="middle">Trusted professional status</text>
    </g>
  </g>

  <!-- Bottom message -->
  <g transform="translate(100, 850)">
    <rect width="880" height="80" rx="15" fill="#16213e"/>
    <text x="440" y="35" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Only verified professionals can receive the</text>
    <text x="440" y="60" font-family="Arial, sans-serif" font-size="18" fill="#00b894" text-anchor="middle">trusted ✓ badge and access customer jobs</text>
  </g>

  <!-- CTA -->
  <g transform="translate(290, 960)">
    <rect width="500" height="65" rx="32" fill="url(#verifyGreen)"/>
    <text x="250" y="43" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Hire with Confidence</text>
  </g>

  <text x="540" y="1055" font-family="Arial, sans-serif" font-size="18" fill="#00b894" text-anchor="middle">caricompros.com</text>
</svg>
