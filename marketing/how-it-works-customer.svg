<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="custBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="custGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffed4e"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#custBg)"/>

  <!-- Header -->
  <g transform="translate(240, 60)">
    <rect width="600" height="50" rx="25" fill="url(#custGold)"/>
    <text x="300" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">FOR CUSTOMERS</text>
  </g>

  <text x="540" y="170" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">How It Works</text>

  <!-- Steps -->
  <g transform="translate(100, 220)">
    <!-- Step 1 -->
    <g>
      <rect width="880" height="160" rx="20" fill="#16213e"/>
      <circle cx="80" cy="80" r="45" fill="url(#custGold)"/>
      <text x="80" y="92" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a2e" text-anchor="middle">1</text>
      <text x="160" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Post Your Job</text>
      <text x="160" y="90" font-family="Arial, sans-serif" font-size="16" fill="#888888">Describe what you need done - plumbing, electrical,</text>
      <text x="160" y="115" font-family="Arial, sans-serif" font-size="16" fill="#888888">painting, or any service. It's completely FREE to post.</text>
      <text x="780" y="90" font-size="50" text-anchor="middle">📝</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 180)">
      <rect width="880" height="160" rx="20" fill="#16213e"/>
      <circle cx="80" cy="80" r="45" fill="url(#custGold)"/>
      <text x="80" y="92" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a2e" text-anchor="middle">2</text>
      <text x="160" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Get Multiple Quotes</text>
      <text x="160" y="90" font-family="Arial, sans-serif" font-size="16" fill="#888888">Verified professionals in your area will send you</text>
      <text x="160" y="115" font-family="Arial, sans-serif" font-size="16" fill="#888888">competitive quotes. Compare prices easily.</text>
      <text x="780" y="90" font-size="50" text-anchor="middle">💰</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 360)">
      <rect width="880" height="160" rx="20" fill="#16213e"/>
      <circle cx="80" cy="80" r="45" fill="url(#custGold)"/>
      <text x="80" y="92" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a2e" text-anchor="middle">3</text>
      <text x="160" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Choose Your Pro</text>
      <text x="160" y="90" font-family="Arial, sans-serif" font-size="16" fill="#888888">Review profiles, ratings, and past work. Chat directly</text>
      <text x="160" y="115" font-family="Arial, sans-serif" font-size="16" fill="#888888">with pros to find the perfect match for your job.</text>
      <text x="780" y="90" font-size="50" text-anchor="middle">⭐</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(0, 540)">
      <rect width="880" height="160" rx="20" fill="#16213e"/>
      <circle cx="80" cy="80" r="45" fill="url(#custGold)"/>
      <text x="80" y="92" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1a1a2e" text-anchor="middle">4</text>
      <text x="160" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">Pay Securely</text>
      <text x="160" y="90" font-family="Arial, sans-serif" font-size="16" fill="#888888">Your payment is held in escrow until the job is done</text>
      <text x="160" y="115" font-family="Arial, sans-serif" font-size="16" fill="#888888">to your satisfaction. 100% protected.</text>
      <text x="780" y="90" font-size="50" text-anchor="middle">🔒</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(290, 960)">
    <rect width="500" height="70" rx="35" fill="url(#custGold)"/>
    <text x="250" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Post Your First Job Free</text>
  </g>

  <text x="540" y="1060" font-family="Arial, sans-serif" font-size="18" fill="#ffd700" text-anchor="middle">caricompros.com</text>
</svg>
