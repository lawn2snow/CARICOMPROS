<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="storyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="storyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffed4e"/>
    </linearGradient>
    <filter id="storyGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#storyBg)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="300" r="200" fill="#ffd700" opacity="0.03"/>
  <circle cx="980" cy="1600" r="250" fill="#ffd700" opacity="0.03"/>

  <!-- Top Swipe Badge -->
  <g transform="translate(340, 100)">
    <rect width="400" height="60" rx="30" fill="url(#storyGold)"/>
    <text x="200" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e" text-anchor="middle">SWIPE UP TO FIND A PRO</text>
  </g>

  <!-- Main Logo Area -->
  <g transform="translate(290, 250)">
    <rect width="500" height="500" rx="100" fill="#16213e" stroke="url(#storyGold)" stroke-width="6"/>
    <text x="250" y="300" font-size="200" text-anchor="middle">🛠️</text>
    <text x="250" y="420" font-family="Arial, sans-serif" font-size="40" fill="#ffd700" text-anchor="middle" font-weight="bold">TRUSTED</text>
  </g>

  <!-- Brand -->
  <text x="540" y="880" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">CariCom</text>
  <text x="540" y="970" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#storyGold)" text-anchor="middle">PROS</text>
  <text x="540" y="1040" font-family="Arial, sans-serif" font-size="32" fill="#888888" text-anchor="middle">Caribbean's Trusted Service Marketplace</text>

  <!-- How It Works -->
  <g transform="translate(100, 1120)" font-family="Arial, sans-serif">
    <text x="440" y="0" font-size="22" fill="#ffd700" text-anchor="middle" letter-spacing="3">HOW IT WORKS</text>

    <!-- Step 1 -->
    <g transform="translate(0, 50)">
      <rect width="880" height="100" rx="20" fill="#16213e"/>
      <circle cx="70" cy="50" r="35" fill="url(#storyGold)"/>
      <text x="70" y="60" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">1</text>
      <text x="140" y="45" font-size="26" font-weight="bold" fill="#ffffff">Post Your Job</text>
      <text x="140" y="75" font-size="18" fill="#888888">Describe what you need - it's free!</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(0, 170)">
      <rect width="880" height="100" rx="20" fill="#16213e"/>
      <circle cx="70" cy="50" r="35" fill="url(#storyGold)"/>
      <text x="70" y="60" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">2</text>
      <text x="140" y="45" font-size="26" font-weight="bold" fill="#ffffff">Get Quotes</text>
      <text x="140" y="75" font-size="18" fill="#888888">Receive quotes from verified pros</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(0, 290)">
      <rect width="880" height="100" rx="20" fill="#16213e"/>
      <circle cx="70" cy="50" r="35" fill="url(#storyGold)"/>
      <text x="70" y="60" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">3</text>
      <text x="140" y="45" font-size="26" font-weight="bold" fill="#ffffff">Choose Your Pro</text>
      <text x="140" y="75" font-size="18" fill="#888888">Compare profiles, reviews & prices</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(0, 410)">
      <rect width="880" height="100" rx="20" fill="#16213e"/>
      <circle cx="70" cy="50" r="35" fill="url(#storyGold)"/>
      <text x="70" y="60" font-size="28" font-weight="bold" fill="#1a1a2e" text-anchor="middle">4</text>
      <text x="140" y="45" font-size="26" font-weight="bold" fill="#ffffff">Get It Done</text>
      <text x="140" y="75" font-size="18" fill="#888888">Pay securely through our platform</text>
    </g>
  </g>

  <!-- CTA Button -->
  <g transform="translate(140, 1720)">
    <rect width="800" height="100" rx="50" fill="url(#storyGold)" filter="url(#storyGlow)"/>
    <text x="400" y="65" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Find a Pro Now</text>
  </g>

  <!-- Website -->
  <text x="540" y="1880" font-family="Arial, sans-serif" font-size="28" fill="#ffd700" text-anchor="middle">caricompros.com</text>
</svg>
