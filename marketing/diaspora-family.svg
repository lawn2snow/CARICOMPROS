<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="famBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f1628"/>
    </linearGradient>
    <linearGradient id="famGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ffed4e"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#f4a261"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#famBg)"/>

  <!-- Decorative pattern -->
  <g opacity="0.03">
    <pattern id="famPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="3" fill="#ffd700"/>
    </pattern>
    <rect width="1080" height="1080" fill="url(#famPattern)"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(240, 80)">
    <rect width="600" height="55" rx="27" fill="url(#heartGrad)"/>
    <text x="300" y="37" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">❤️ FOR THE CARIBBEAN DIASPORA</text>
  </g>

  <!-- Main visual - House with heart -->
  <g transform="translate(390, 180)">
    <rect width="300" height="280" rx="40" fill="#16213e" stroke="url(#famGold)" stroke-width="4"/>
    <text x="150" y="140" font-size="100" text-anchor="middle">🏠</text>
    <text x="150" y="220" font-size="50" text-anchor="middle">❤️</text>
  </g>

  <!-- Headline -->
  <text x="540" y="540" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">Your Family.</text>
  <text x="540" y="605" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">Your Property.</text>
  <text x="540" y="670" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#famGold)" text-anchor="middle">Our Trusted Pros.</text>

  <!-- Use cases -->
  <g transform="translate(100, 720)" font-family="Arial, sans-serif">
    <g>
      <rect width="420" height="80" rx="15" fill="#16213e"/>
      <text x="25" y="50" font-size="28">👴👵</text>
      <text x="80" y="45" font-size="18" fill="#ffffff">Take care of your parents' home</text>
      <text x="80" y="68" font-size="14" fill="#888888">Repairs, maintenance & emergencies</text>
    </g>
    <g transform="translate(460, 0)">
      <rect width="420" height="80" rx="15" fill="#16213e"/>
      <text x="25" y="50" font-size="28">🏡</text>
      <text x="80" y="45" font-size="18" fill="#ffffff">Manage your rental property</text>
      <text x="80" y="68" font-size="14" fill="#888888">Renovations & upkeep from abroad</text>
    </g>
    <g transform="translate(0, 100)">
      <rect width="420" height="80" rx="15" fill="#16213e"/>
      <text x="25" y="50" font-size="28">✈️</text>
      <text x="80" y="45" font-size="18" fill="#ffffff">Prepare for your next visit</text>
      <text x="80" y="68" font-size="14" fill="#888888">Get the house ready before you land</text>
    </g>
    <g transform="translate(460, 100)">
      <rect width="420" height="80" rx="15" fill="#16213e"/>
      <text x="25" y="50" font-size="28">🛡️</text>
      <text x="80" y="45" font-size="18" fill="#ffffff">Secure payment protection</text>
      <text x="80" y="68" font-size="14" fill="#888888">Pay only when the job is done right</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(290, 950)">
    <rect width="500" height="75" rx="37" fill="url(#famGold)"/>
    <text x="250" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a1a2e" text-anchor="middle">Find a Pro Back Home</text>
  </g>

  <!-- Website -->
  <text x="540" y="1055" font-family="Arial, sans-serif" font-size="20" fill="#ffd700" text-anchor="middle">caricompros.com</text>
</svg>
